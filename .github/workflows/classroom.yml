name: Private Grade

on: [push]

jobs:
  grade-3b:
    name: Project3B Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.19"
      - name: Run Project 3B tests
        run: LOG_LEVEL=error go test ./kv/test_raftstore -run '3B$' -count=1 -timeout 30m
