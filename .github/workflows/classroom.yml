name: Full CI

on: [push, workflow_dispatch]

jobs:
  full-test:
    name: Full Repository Tests
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.19"
      - name: Run CI checks
        run: make ci
      - name: Run full tests
        run: make test
